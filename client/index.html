<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LiveChat</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 24px;
        }
        #messages {
            border: 1px solid #ccc;
            min-height: 200px;
            padding: 12px;
            margin-top: 12px;
            max-width: 600px;
            overflow-y: auto;
            background: #fafafa;
        }
        .message {
            margin-bottom: 8px;
        }
        input {
            padding: 8px;
            font-size: 14px;
        }
        button {
            padding: 8px 12px;
            font-size: 14px;
            margin-left: 4px;
        }
    </style>
</head>
<body>
    <h1>LiveChat</h1>

    <div>
        <input id="room" placeholder="room id" />
        <button onclick="joinRoom()">Join Room</button>
    </div>

    <div style="margin-top: 12px;">
        <input id="input" placeholder="Type a message" style="width: 300px;" />
        <button onclick="sendMessage()">Send</button>
    </div>

    <div id="status" style="margin-top: 12px; color: #555;"></div>
    <div id="messages"></div>

    <script src="app.js"></script>
</body>
</html>
